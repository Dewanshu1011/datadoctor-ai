# Copy these settings into Streamlit Cloud → Manage app → Settings → Secrets.
# NEVER commit real credentials to this file or GitHub.

[auth]
redirect_uri = "https://YOUR-APP.streamlit.app/oauth2callback"
cookie_secret = "GENERATE_WITH_SECRETS_TOKEN_URLSAFE"
client_id = "YOUR_GOOGLE_CLIENT_ID"
client_secret = "YOUR_GOOGLE_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

OPENAI_API_KEY = "YOUR_OPENAI_API_KEY"
OPENAI_MODEL = "gpt-4.1-mini"

[app]
# Strongly recommended for a private/internal deployment.
# Remove this comment and add approved accounts.
allowed_emails = ["you@example.com"]

# Lightweight application-level safeguards.
max_ai_calls_per_hour = 10
ai_cooldown_seconds = 3
max_rows = 1000000
max_columns = 500
